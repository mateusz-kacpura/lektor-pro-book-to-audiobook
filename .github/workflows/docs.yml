name: Documentation & Architecture Quality

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install documentation & linting tools
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material "mkdocstrings[python]" mkdocs-static-i18n pymdown-extensions import-linter

      - name: Verify Clean Architecture Import Rules
        run: |
          lint-imports

      - name: Build Documentation (Strict Mode)
        run: |
          mkdocs build --strict

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-material "mkdocstrings[python]" mkdocs-static-i18n pymdown-extensions

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4